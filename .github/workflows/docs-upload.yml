name: docs upload

# Uploads a previously created docs html to the github pages site
# Avoids pushing to a local branch to avoid cloning inefficiencies

permissions:
  pages: write
  id-token: write

on:
  workflow_call:
    inputs: {}
    outputs: {}

jobs:
  github-pages:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
    - name: Deploy page
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
