name: uv publish

# Publish the build outputs from the python-uv-build workflow.
# Assumes that the repo is a trusted publisher on pypi, using a "pypi" environment.

# Note that this workflow cannot be used as-is with trusted publishing.
# This is because of how pypi trusted publishing from github is set up: only a local workflow has the permissions.
# See the example in the repo root and/or copy these workflow steps if you'd like to upload with trusted publishing.

permissions:
  id-token: write

on:
  workflow_call:
    inputs: {}
    outputs: {}

jobs:
  publish-dist:
    runs-on: ubuntu-latest
    environment:
      name: pypi

    defaults:
      run:
        shell: bash

    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        # Lock version to what we use in prod
        version: "0.13.4"

    - name: Download distributions artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: dist
        path: dist/

    - name: Publish
      run: uv publish
